name: Publish to swme.ae Educational

# Validation runs on GitHub. Publishing runs on the self-hosted runner
# (your PC), because swme.ae blocks GitHub's servers.

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "config/**"
      - "assets/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "changed = only new/edited articles, all = full sync, dry-run = test login only"
        type: choice
        options: [changed, all, dry-run]
        default: changed

concurrency:
  group: swme-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/publish.py --validate

  publish:
    needs: validate
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
    env:
      SWME_BASE_URL: ${{ vars.SWME_BASE_URL || 'https://swme.ae' }}
      SWME_EMAIL: ${{ secrets.SWME_EMAIL }}
      SWME_PASSWORD: ${{ secrets.SWME_PASSWORD }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: List changed files (push)
        if: github.event_name == 'push'
        run: python scripts/changed.py ${{ github.event.before }} ${{ github.sha }}

      - name: List changed files (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'changed'
        run: python scripts/changed.py HEAD~1 HEAD

      - name: Publish changed
        if: github.event_name == 'push' || inputs.mode == 'changed'
        run: python scripts/publish.py --changed changed.txt

      - name: Publish all
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'all'
        run: python scripts/publish.py

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: python scripts/publish.py --dry-run
